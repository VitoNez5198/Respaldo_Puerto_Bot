<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Arquitectura de Automatizacion Respaldo Puerto Bot">
  <defs>
    <style>
      .diag-bg { fill: #111720; }
      .diag-zone { fill: rgba(148, 163, 184, 0.03); stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.1; stroke-dasharray: 4 3; }
      .diag-zone-label { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 9px; font-weight: 600; }
      .diag-box { fill: #17202c; stroke: rgba(148, 163, 184, 0.35); stroke-width: 1.3; }
      .diag-box-accent { fill: rgba(91, 164, 245, 0.12); stroke: #5ba4f5; stroke-width: 1.3; }
      .diag-box-ok { fill: rgba(52, 211, 153, 0.10); stroke: #34d399; stroke-width: 1.3; }
      .diag-label { fill: #f0f6fc; font-family: 'Fira Code', Consolas, monospace; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .diag-sub { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8.5px; text-anchor: middle; }
      .diag-edge { fill: #94a3b8; font-family: 'Fira Code', Consolas, monospace; font-size: 8px; }
      .diag-line { fill: none; stroke: #94a3b8; stroke-width: 1.25; }
      .diag-line-dashed { fill: none; stroke: #5ba4f5; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .diag-arrow { fill: #94a3b8; }
      .diag-arrow-accent { fill: #5ba4f5; }
    </style>
    <marker id="arr-puerto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
    <marker id="arr-puerto-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="diag-arrow-accent" d="M 0 1 L 10 5 L 0 9 z" />
    </marker>
  </defs>

  <rect class="diag-bg" x="0" y="0" width="640" height="300" rx="8" />

  <!-- Operador y Telegram -->
  <rect class="diag-box" x="16" y="124" width="96" height="52" rx="6" />
  <text class="diag-label" x="64" y="147">Operador</text>
  <text class="diag-sub" x="64" y="162">Código + Fotos</text>

  <rect class="diag-box" x="136" y="124" width="104" height="52" rx="6" />
  <text class="diag-label" x="188" y="147">Telegram API</text>
  <text class="diag-sub" x="188" y="162">Chat Privado</text>

  <!-- Zona Servidor Oficina -->
  <rect class="diag-zone" x="262" y="18" width="206" height="264" rx="8" />
  <text class="diag-zone-label" x="274" y="35">Servidor Local (Python)</text>

  <rect class="diag-box-accent" x="278" y="52" width="174" height="48" rx="6" />
  <text class="diag-label" x="365" y="73">Validador Regex</text>
  <text class="diag-sub" x="365" y="88">Formato ISO (4L + 7N)</text>

  <rect class="diag-box-accent" x="278" y="124" width="174" height="52" rx="6" />
  <text class="diag-label" x="365" y="147">Bot Worker</text>
  <text class="diag-sub" x="365" y="162">Lock · Timer Debounce</text>

  <rect class="diag-box-ok" x="278" y="206" width="174" height="48" rx="6" />
  <text class="diag-label" x="365" y="227">Configuración (.env)</text>
  <text class="diag-sub" x="365" y="242">Token · Canal · Ruta</text>

  <!-- Destinos de Respaldo -->
  <rect class="diag-box-ok" x="496" y="64" width="128" height="54" rx="6" />
  <text class="diag-label" x="560" y="87">Respaldo Local</text>
  <text class="diag-sub" x="560" y="102">Año/Mes/Contenedor</text>

  <rect class="diag-box-ok" x="496" y="182" width="128" height="54" rx="6" />
  <text class="diag-label" x="560" y="205">Canal Telegram</text>
  <text class="diag-sub" x="560" y="220">Copia en Nube</text>

  <!-- Flechas principales -->
  <line class="diag-line" x1="112" y1="150" x2="132" y2="150" marker-end="url(#arr-puerto)" />
  <line class="diag-line" x1="240" y1="150" x2="274" y2="150" marker-end="url(#arr-puerto)" />

  <path class="diag-line" d="M 452 140 L 474 140 L 474 91 L 492 91" marker-end="url(#arr-puerto)" />
  <path class="diag-line" d="M 452 160 L 474 160 L 474 209 L 492 209" marker-end="url(#arr-puerto)" />

  <!-- Flechas internas -->
  <line class="diag-line-dashed" x1="365" y1="100" x2="365" y2="120" marker-end="url(#arr-puerto-acc)" />
  <line class="diag-line-dashed" x1="365" y1="206" x2="365" y2="180" marker-end="url(#arr-puerto-acc)" />
</svg>
